# Paste inside the existing HTTPS server { } for 1404kingstreet.com
# These exact-match redirects matter: /gilaki-api without a slash does not
# match location /gilaki-api/ and will fall through to the other site on this host.
# Point alias at this clone's web/ directory.

location = /gilaki-api {
    return 301 /gilaki-api/;
}

location /gilaki-api/ {
    proxy_pass http://127.0.0.1:18741/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 15m;
    proxy_read_timeout 120s;
}

location = /gilaki-app {
    return 301 /gilaki-app/;
}

location /gilaki-app/ {
    alias /opt/gilaki-ipa/web/;
}
